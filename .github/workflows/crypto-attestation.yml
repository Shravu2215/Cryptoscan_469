name: Crypto Attestation

# Generates a signed in-toto attestation of the CBOM scan result for every
# push to main and for every pull-request, and publishes it to the Rekor
# transparency log via Sigstore keyless signing.
#
# Optional steps (controlled by repository variables/secrets):
#   CRYPTOSCAN_WITH_PQC=true     — add experimental ML-DSA-65 hybrid envelope
#   CRYPTOSCAN_SEPOLIA_ANCHOR=1  — anchor attestation hash to Sepolia (requires
#                                   SEPOLIA_RPC_URL + WALLET_PRIVATE_KEY secrets)
#
# The attestation artefacts are:
#   cbom.json                   — CycloneDX 1.6 CBOM of the scanned repo
#   attestation.intoto.json     — in-toto Statement v1 (subject = cbom.json SHA-256)
#   attestation.bundle.json     — Sigstore bundle v0.3 (certificate + Rekor entry)
#   attestation.hybrid.json     — ML-DSA-65 outer envelope (experimental, optional)
#   attestation-summary.json    — machine-readable summary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_pqc:
        description: 'Add ML-DSA-65 hybrid envelope'
        type: boolean
        default: true
      with_sepolia:
        description: 'Anchor hash to Sepolia blockchain'
        type: boolean
        default: false

permissions:
  # Required for Sigstore keyless signing (GitHub OIDC token)
  id-token: write
  # Required to read repository contents
  contents: read
  # Required for actions/attest (GitHub native attestation)
  attestations: write

jobs:
  attest-cbom:
    name: Attest CBOM
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            scanner/requirements.txt
            attestation/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install scanner + attestation dependencies
        run: |
          pip install --upgrade pip
          pip install -r scanner/requirements.txt
          pip install -r attestation/requirements.txt

      # ── 4. Scan → CBOM ───────────────────────────────────────────────────────
      - name: Scan repository → cbom.json
        run: |
          python cryptoscan scan . --out cbom.json
          echo "CBOM components: $(python -c "import json; d=json.load(open('cbom.json')); print(len(d.get('components',[])))")"

      # ── 5. GitHub native attestation (actions/attest) ────────────────────────
      - name: GitHub native attestation (actions/attest)
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: actions/attest@v2
        with:
          subject-path: cbom.json
          predicate-type: 'https://cryptoscan.dev/attestation/cbom/v1'
          predicate: |
            {
              "scanner": "cryptoscan/1.0.0",
              "repository": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }
        continue-on-error: true   # non-blocking auxiliary audit trail

      # ── 6. CryptoScan in-toto + Sigstore attestation ─────────────────────────
      - name: Generate in-toto Statement + Sigstore bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'true' || 'false' }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          CRYPTO_ANCHOR_CONTRACT_ADDRESS: ${{ secrets.CBOM_REGISTRY_ADDRESS || secrets.CRYPTO_ANCHOR_CONTRACT_ADDRESS }}
        run: |
          PQC_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_pqc }}" = "true" ]; then
            PQC_FLAG="--with-pqc"
          elif [ "${{ vars.CRYPTOSCAN_WITH_PQC }}" = "true" ] || [ "${{ env.CRYPTOSCAN_WITH_PQC }}" = "true" ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PQC_FLAG="--with-pqc"
          fi

          SEPOLIA_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_sepolia }}" = "true" ]; then
            SEPOLIA_FLAG="--with-sepolia"
          elif [ "${{ vars.CRYPTOSCAN_SEPOLIA_ANCHOR }}" = "1" ]; then
            SEPOLIA_FLAG="--with-sepolia"
          fi

          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::notice ::Running in unprivileged fork PR mode — Sigstore OIDC unavailable; generating offline development bundle."
            python -m attestation.cli attest \
              --cbom cbom.json \
              --out-statement attestation.intoto.json \
              --out-bundle    attestation.bundle.json \
              --out-hybrid    attestation.hybrid.json \
              --repo          "${{ github.repository }}" \
              --commit        "${{ github.sha }}" \
              --branch        "${{ github.ref_name }}" \
              $PQC_FLAG $SEPOLIA_FLAG \
              --allow-offline \
              > attestation-summary.json
          else
            echo "Running in strict production mode with Sigstore keyless signing..."
            python -m attestation.cli attest \
              --cbom cbom.json \
              --out-statement attestation.intoto.json \
              --out-bundle    attestation.bundle.json \
              --out-hybrid    attestation.hybrid.json \
              --repo          "${{ github.repository }}" \
              --commit        "${{ github.sha }}" \
              --branch        "${{ github.ref_name }}" \
              $PQC_FLAG $SEPOLIA_FLAG \
              --strict \
              > attestation-summary.json
          fi

          echo "=== Attestation Summary ==="
          cat attestation-summary.json

      # ── 7. Independent Cryptographic Verification ────────────────────────────
      - name: Verify attestation (self-verification)
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'true' || 'false' }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "Verifying fork PR development bundle with offline allowance..."
            python -m attestation.cli verify \
              --cbom      cbom.json \
              --statement attestation.intoto.json \
              --bundle    attestation.bundle.json \
              --hybrid    attestation.hybrid.json \
              --allow-offline \
              --no-rekor
          else
            echo "Verifying genuine Sigstore keyless bundle and certificate identity..."
            EXPECTED_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/crypto-attestation.yml@refs/heads/${{ github.ref_name }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              EXPECTED_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/crypto-attestation.yml@refs/pull/${{ github.event.pull_request.number }}/merge"
            fi
            python -m attestation.cli verify \
              --cbom      cbom.json \
              --statement attestation.intoto.json \
              --bundle    attestation.bundle.json \
              --hybrid    attestation.hybrid.json \
              --identity  "$EXPECTED_IDENTITY" \
              --issuer    "https://token.actions.githubusercontent.com"
          fi

      # ── 8. Publish Job Summary ────────────────────────────────────────────────
      - name: Publish attestation summary
        if: always()
        run: |
          echo "## 🔏 CryptoScan CBOM Attestation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f attestation-summary.json ]; then
            CBOM_SHA=$(python -c "import json; d=json.load(open('attestation-summary.json')); print(d.get('cbomSha256','N/A'))")
            REKOR_ID=$(python -c "import json; d=json.load(open('attestation-summary.json')); print(d.get('rekorLogId') or 'None')")
            MODE=$(python -c "import json; d=json.load(open('attestation-summary.json')); print(d.get('mode','unknown'))")
            SIGNED=$(python -c "import json; d=json.load(open('attestation-summary.json')); print('✅ Keyless Signed (Sigstore)' if d.get('signed') else '⚠️ Unsigned Offline Bundle')")
            IDENTITY=$(python -c "import json; d=json.load(open('attestation-summary.json')); print(d.get('signerIdentity') or 'None')")
            PQC_ALGO=$(python -c "import json; d=json.load(open('attestation-summary.json')); print(d.get('experimental',{}).get('pqcAlgorithm') or 'None')")

            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Attestation Status** | ${SIGNED} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Mode** | \`${MODE}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **CBOM SHA-256** | \`${CBOM_SHA}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Signer Identity (OIDC SAN)** | \`${IDENTITY}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Rekor Transparency Log ID** | \`${REKOR_ID}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Post-Quantum Algorithm** | ${PQC_ALGO} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Repository** | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Attestation summary file not generated." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 9. Upload attestation artefacts ──────────────────────────────────────
      - name: Upload attestation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoscan-attestation-${{ github.sha }}
          path: |
            cbom.json
            attestation.intoto.json
            attestation.bundle.json
            attestation.hybrid.json
            attestation-summary.json
          if-no-files-found: warn
          retention-days: 90
