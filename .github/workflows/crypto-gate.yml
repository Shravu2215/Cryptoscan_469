name: Crypto Ratchet Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Documentation:
# 1. Branch Protection: Set the check name "crypto-gate" (or the job name "evaluate-gate")
#    as a REQUIRED status check in your repository branch protection settings.
# 2. CODEOWNERS: Protect ".cryptoscan/waivers.yaml" with CODEOWNERS (e.g., .cryptoscan/ @security-team)
#    so developers cannot approve their own cryptographic waivers.

jobs:
  evaluate-gate:
    name: crypto-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Head (PR Branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scanner/requirements.txt

      - name: Install Scanner Dependencies
        run: |
          pip install -r scanner/requirements.txt
          pip install pyyaml

      - name: Scan Head (PR Branch) -> head.cbom.json
        run: |
          python cryptoscan scan . --out head.cbom.json

      - name: Checkout and Scan Base Branch -> base.cbom.json
        run: |
          git fetch origin ${{ github.base_ref }}
          git worktree add ../base-ref origin/${{ github.base_ref }}
          python cryptoscan scan ../base-ref --out base.cbom.json
          git worktree remove ../base-ref

      - name: Run Crypto Ratchet Gate
        id: gate
        continue-on-error: true
        run: |
          python cryptoscan gate \
            --base base.cbom.json \
            --head head.cbom.json \
            --policy .cryptoscan/policy.yaml \
            --waivers .cryptoscan/waivers.yaml \
            --format md,json \
            --out-md gate-report.md \
            --out-json gate-report.json
          echo "gate_exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish Job Summary
        if: always()
        run: |
          if [ -f gate-report.md ]; then
            cat gate-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post or Update Sticky PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('gate-report.md')) {
              console.log('gate-report.md not found, skipping PR comment');
              return;
            }
            const body = fs.readFileSync('gate-report.md', 'utf8');
            const marker = '<!-- cryptoscan-gate -->';
            
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(c => c.body.includes(marker));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body,
                });
                console.log(`Updated existing PR comment ID: ${existingComment.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
                console.log('Created new sticky PR comment.');
              }
            } catch (err) {
              console.log('Notice: Could not write PR comment (token may be read-only for forks). Full report is in GITHUB_STEP_SUMMARY. Error:', err.message);
            }

      - name: Upload Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoscan-gate-artifacts
          path: |
            head.cbom.json
            base.cbom.json
            gate-report.md
            gate-report.json
          if-no-files-found: warn

      - name: Enforce Gate Verdict
        run: |
          EXIT_CODE=${{ steps.gate.outputs.gate_exit_code }}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Crypto Ratchet Gate failed with exit code $EXIT_CODE."
            exit $EXIT_CODE
          fi
          echo "✅ Crypto Ratchet Gate passed!"
