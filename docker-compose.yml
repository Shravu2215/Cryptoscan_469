# docker-compose.yml – CryptoScan
#
# Hostile-Repository Hardening (Req 4) — scanner service:
#   • Runs as non-root (UID 10001, defined in scanner/Dockerfile)
#   • read_only: true  – root filesystem is read-only
#   • tmpfs /tmp/scan  – only writable directory; used for scan temp dirs
#   • network_mode: none or internal-only network – no outbound access
#   • CPU/memory/pids limits enforced via deploy.resources + pids_limit
#   • No capabilities (cap_drop: ALL)
#   • security_opt: no-new-privileges

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptoscan_user
      POSTGRES_PASSWORD: cryptoscan_password
      POSTGRES_DB: cryptoscan
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoscan_user -d cryptoscan"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Scanner — sandboxed, low-privilege (Req 4) ─────────────────────────────
  scanner:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    restart: unless-stopped

    # Non-root user (UID 10001 defined in Dockerfile)
    user: "10001:10001"

    # Read-only root filesystem — only /tmp/scan is writable (tmpfs below)
    read_only: true

    # Writable tmpfs for scan temp directories; kept in RAM, wiped on restart
    tmpfs:
      - /tmp/scan:size=512m,mode=1777

    # No network access — scanner only reads files, never phones home
    # Use an isolated internal network instead of host/none so backend-core
    # can still call the scanner HTTP API on port 5001.
    networks:
      - scanner-internal

    # Drop ALL capabilities — scanner only needs to read files
    cap_drop:
      - ALL

    # No privilege escalation (no SUID/SGID abuse)
    security_opt:
      - no-new-privileges:true

    # Resource limits (configurable; defaults are sane for a scan worker)
    deploy:
      resources:
        limits:
          cpus: "${SCANNER_CPU_LIMIT:-1.0}"
          memory: "${SCANNER_MEMORY_LIMIT:-1G}"
          # pids limit prevents fork bombs from the scanned code
          pids: ${SCANNER_PIDS_LIMIT:-128}

    environment:
      # Resource limits passed into security.py
      SCANNER_MAX_FILE_SIZE_MB:    "${SCANNER_MAX_FILE_SIZE_MB:-10}"
      SCANNER_MAX_TOTAL_SIZE_MB:   "${SCANNER_MAX_TOTAL_SIZE_MB:-512}"
      SCANNER_MAX_FILES:           "${SCANNER_MAX_FILES:-50000}"
      SCANNER_MAX_AST_DEPTH:       "${SCANNER_MAX_AST_DEPTH:-50}"
      SCANNER_MAX_AST_NODES:       "${SCANNER_MAX_AST_NODES:-100000}"
      SCANNER_PER_FILE_TIMEOUT_SEC: "${SCANNER_PER_FILE_TIMEOUT_SEC:-30}"
      SCANNER_SCAN_TIMEOUT_SEC:    "${SCANNER_SCAN_TIMEOUT_SEC:-600}"
      SCANNER_MAX_SNIPPET_LENGTH:  "${SCANNER_MAX_SNIPPET_LENGTH:-500}"
      SCAN_ROOT: /tmp/scan

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend-core:
    build:
      context: .
      dockerfile: backend-core/Dockerfile
    env_file: ./backend-core/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://cryptoscan_user:cryptoscan_password@postgres:5432/cryptoscan
      # Point backend-core at the scanner container instead of local subprocess
      # (only used when SCANNER_MODE=container; default is subprocess for dev)
      SCANNER_API_URL: "http://scanner:5001"
    volumes:
      - backend-uploads:/app/backend-core/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scanner:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - default
      - scanner-internal

  cbom-service:
    build:
      context: .
      dockerfile: cbom-service/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:4003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-core:
        condition: service_healthy
      cbom-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backend-uploads:

networks:
  default: {}
  # Internal-only network between backend-core and scanner.
  # No external connectivity — scanner cannot reach the internet.
  scanner-internal:
    internal: true
    driver: bridge
